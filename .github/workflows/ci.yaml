name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions: {}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '16'
          cache: 'npm'
      - run: npm ci

      - run: npm run test -- --no-watch --no-progress --browsers=ChromeHeadless

      # TODO: Coveralls